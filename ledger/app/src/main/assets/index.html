<title>دفتر الحسابات</title>
<style>
  /* Ledger for subscriber accounts: teal for money, amber for what is owed, red for what is late. */
  :root {
    --bg: #F4F6F3; --surface: #FFFFFF; --ink: #14201F; --muted: #5B6B69; --line: #DCE4E0;

    --info: #1D4ED8; --info-soft: #DBEAFE;
    --shadow: 0 1px 2px rgba(20,32,31,.06), 0 8px 22px rgba(20,32,31,.07);
    --font: "Noto Sans Arabic", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1716; --surface: #17211F; --ink: #E8F0EE; --muted: #9BB0AC; --line: #26352F;
      --brand: #2DD4BF; --brand-ink: #062521; --brand-soft: #123530; --brand-deep: #0B3B37; --bar: #0B3B37; --bar-ink: #E8F0EE;
      --good: #4ADE80; --good-soft: #12301F; --warn: #FBBF24; --warn-soft: #33270B;
      --bad: #F87171; --bad-soft: #3A1B1B; --info: #7DA7FF; --info-soft: #172A4F;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1716; --surface: #17211F; --ink: #E8F0EE; --muted: #9BB0AC; --line: #26352F;
    --brand: #2DD4BF; --brand-ink: #062521; --brand-soft: #123530; --brand-deep: #0B3B37; --bar: #0B3B37; --bar-ink: #E8F0EE;
    --good: #4ADE80; --good-soft: #12301F; --warn: #FBBF24; --warn-soft: #33270B;
    --bad: #F87171; --bad-soft: #3A1B1B; --info: #7DA7FF; --info-soft: #172A4F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font); overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

  .app { height: 100%; display: flex; flex-direction: column; }
  .bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; min-height: 56px;
    background: var(--bar); color: var(--bar-ink); box-shadow: 0 2px 10px rgba(0,0,0,.14); z-index: 3; }
  .bar h1 { flex: 1; margin: 0; font-size: 19px; font-weight: 800; letter-spacing: .1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ibtn { width: 42px; height: 42px; flex: none; display: inline-grid; place-items: center; border: 0; border-radius: 14px;
    background: rgba(255,255,255,.16); color: inherit; transition: transform .12s ease, background .2s; }
  .ibtn:active { transform: scale(.94); }
  .ibtn.plain { background: transparent; color: var(--muted); }
  .main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 120px; }
  .main > * + * { margin-top: 14px; }

  .nav { flex: none; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); z-index: 3; }
  .nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 4px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 700; border-radius: 14px; }
  .nav button[aria-current="page"] { color: var(--brand); }
  .nav button[aria-current="page"] .ic { background: var(--brand-soft); }
  .nav .ic { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .2s; }
  .fab { position: fixed; inset-inline-start: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border: 0; border-radius: 20px;
    background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; box-shadow: 0 10px 24px rgba(15,118,110,.45); z-index: 4; transition: transform .15s; }
  .fab:active { transform: scale(.93); }
  .ic { display: inline-grid; place-items: center; line-height: 0; }
  .ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ic.sm svg { width: 18px; height: 18px; }
  .ic.lg svg { width: 26px; height: 26px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); }
  .card h2, .sec-h { margin: 0 0 10px; font-size: 16px; font-weight: 800; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 2px 8px; }
  .sec-h a, .link { color: var(--brand); font-weight: 700; font-size: 14px; background: none; border: 0; padding: 4px 2px; }
  .hello { display: flex; flex-direction: column; gap: 0; }
  .hello b { font-size: 22px; font-weight: 800; } .hello span { color: var(--muted); font-size: 14px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { position: relative; padding: 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); text-align: start; box-shadow: var(--shadow); }
  .stat small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; }
  .stat b { display: block; margin-top: 4px; font-size: 21px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
  .stat i { font-style: normal; font-size: 12px; color: var(--muted); }
  .stat.good { background: var(--good-soft); border-color: transparent; } .stat.good b { color: var(--good); }
  .stat.warn { background: var(--warn-soft); border-color: transparent; } .stat.warn b { color: var(--warn); }
  .stat.bad { background: var(--bad-soft); border-color: transparent; } .stat.bad b { color: var(--bad); }
  .stat.brand { background: var(--brand); color: var(--brand-ink); border-color: transparent; } .stat.brand small, .stat.brand i { color: inherit; opacity: .85; }

  .list { display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; cursor: pointer; transition: transform .12s ease, background .2s; }
  .row:active { transform: scale(.985); }
  .av { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; }
  .row .main-t { flex: 1; min-width: 0; }
  .row .main-t b { display: block; font-weight: 800; overflow-wrap: anywhere; line-height: 1.35; }
  .row .main-t small { display: block; color: var(--muted); font-size: 13px; }
  .row .amt { text-align: end; font-weight: 800; white-space: nowrap; font-size: 15px; }
  .row .amt small { display: block; font-weight: 600; font-size: 12px; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .info { color: var(--info); }
  .acts { display: flex; gap: 6px; flex: none; }
  .acts button, .chipbtn { width: 38px; height: 38px; border: 0; border-radius: 12px; display: inline-grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
  .acts button.wa { background: var(--good-soft); color: var(--good); }
  .acts button.pay { background: var(--brand); color: var(--brand-ink); }

  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--line); color: var(--ink); white-space: nowrap; }
  .pill.good { background: var(--good-soft); color: var(--good); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.info { background: var(--info-soft); color: var(--info); }

  .tools { display: grid; gap: 8px; }
  .search { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 46px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .chip b { min-width: 22px; padding: 0 6px; border-radius: 999px; background: var(--line); font-size: 12px; text-align: center; line-height: 20px; }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .chip[aria-pressed="true"] b { background: rgba(255,255,255,.25); }

  .btn { min-height: 48px; padding: 0 18px; border-radius: 16px; border: 0; background: var(--brand); color: var(--brand-ink); font-weight: 800; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s ease, opacity .2s; }
  .btn:active { transform: scale(.97); }
  .btn.block { width: 100%; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.soft { background: var(--brand-soft); color: var(--brand); }
  .btn.danger { background: var(--bad-soft); color: var(--bad); }
  .btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 13px; }
  .btn[disabled] { opacity: .5; }
  .btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }

  .hero { display: grid; gap: 10px; }
  .hero .who { display: flex; align-items: center; gap: 12px; }
  .hero .who .av { width: 54px; height: 54px; font-size: 22px; }
  .hero .who b { font-size: 20px; font-weight: 800; line-height: 1.3; }
  .hero .bal { padding: 12px 14px; border-radius: 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .hero .bal b { font-size: 26px; font-weight: 800; }
  .hero .bal.warn { background: var(--warn-soft); } .hero .bal.bad { background: var(--bad-soft); } .hero .bal.good { background: var(--good-soft); } .hero .bal.info { background: var(--info-soft); }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .kv span:first-child { color: var(--muted); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: var(--line); }

  .item { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; }
  .item .t { flex: 1; min-width: 0; } .item .t b { display: block; overflow-wrap: anywhere; line-height: 1.35; } .item .t small { color: var(--muted); font-size: 13px; }
  .item .a { text-align: end; font-weight: 800; white-space: nowrap; } .item .a small { display: block; font-weight: 600; font-size: 12px; color: var(--muted); }
  .item.void { opacity: .5; } .item.void .t b, .item.void .a { text-decoration: line-through; }

  .bar-prog i { display: block; height: 100%; background: var(--good); border-radius: 4px; }

  .empty { text-align: center; padding: 26px 16px; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .note { padding: 12px 14px; border-radius: 16px; background: var(--warn-soft); color: var(--warn); font-weight: 700; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .note.brand { background: var(--brand-soft); color: var(--brand); }

  .layer { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(8,16,15,.5); animation: fadeIn .2s ease both; }
  .sheet { width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .28s cubic-bezier(.2,.8,.2,1) both; }
  .sheet::before { content: ''; display: block; width: 42px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
  .sheet h2 { margin: 0 0 12px; font-size: 19px; font-weight: 800; }
  .sheet > * + * { margin-top: 12px; }
  @keyframes fadeIn { from { opacity: 0; } } @keyframes sheetUp { from { transform: translateY(40px); opacity: .6; } }
  .fld { display: grid; gap: 6px; } .fld > span { font-size: 14px; font-weight: 700; color: var(--muted); }
  .fld input, .fld select, .fld textarea { width: 100%; min-height: 48px; padding: 8px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; outline: 0; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .fld textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
  .fld .big { font-size: 28px; font-weight: 800; text-align: center; min-height: 62px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .qk { display: flex; flex-wrap: wrap; gap: 6px; }
  .paper { margin: 0 auto; width: min(100%, 384px); padding: 8px; background: #fff; border: 1px dashed var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.14); }
  .paper img { display: block; width: 100%; height: auto; background: #fff; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 92px; padding: 4px 0; }
  .bars i { flex: 1; min-width: 4px; border-radius: 4px 4px 0 0; background: var(--brand); opacity: .85; }
  .bars-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toast { position: fixed; inset-inline: 16px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40; margin: 0 auto; max-width: 520px; padding: 12px 18px; border-radius: 999px; background: #14201F; color: #fff; font-weight: 700; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.3); animation: sheetUp .25s ease both; }
  .more { margin: 4px 0; }
  @media (prefers-reduced-motion: reduce) { *, .sheet, .layer { animation: none !important; transition: none !important; } }
  .stack { display: grid; gap: 14px; }
  .row.wrap { flex-wrap: wrap; } .row.wrap .acts { flex-basis: 100%; justify-content: flex-end; margin-top: -2px; }
  a.btn, a.chipbtn { text-decoration: none; }
  .card.list { display: grid; gap: 12px; }
</style>
</head>
<body>

<div id="layer"></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

    .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/\s+/g, ' ').trim();
}
function hKey(num) { var d = toEn(num).replace(/\D/g, ''); return d.length >= 7 ? d.slice(-9) : d; }
function recNo(p) { return (db.cfg.pre || '') + String(p.no).padStart(5, '0'); }
var toastT = null;
function toast(msg, ms) {
  var t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, ms || 3000);
}
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
// destructive buttons ask twice: the first tap changes the label, the second one confirms
function armed(btn, label, fn) {
  var base = btn.textContent, t = null, on = false;
  btn.addEventListener('click', function () {
    if (on) { clearTimeout(t); on = false; fn(); return; }
    on = true; btn.textContent = label;
    t = setTimeout(function () { on = false; btn.textContent = base; }, 3000);
  });
  return btn;
}

/* ================= data ================= */
var DEF_TPL = 'السلام عليكم {الاسم}، نذكّركم بأن المتبقي عليكم {المبلغ} {العملة} وكان موعده {التاريخ}. نشكر لكم حسن تعاونكم. {المحل}';
var KEY = 'ledger:v1';
var db = null, idx = null, ver = 0, accCache = {};

function blank() {
  return { v: 1, seq: { rec: 0, id: 0 }, customers: {}, charges: [], pays: [], subs: [],
    cfg: { shop: '', shopph: '', curr: '', foot: 'شكراً لتعاملكم معنا', pw: 384, cc: '', tpl: DEF_TPL, theme: 'auto', pre: '', dens: 'normal', printer: null },
    meta: { saved: 0, lastBackup: 0 } };
}
function fixDb(d) {
  var b = blank();
  d = d && typeof d === 'object' ? d : {};
  var o = { v: 1, seq: Object.assign(b.seq, d.seq || {}), customers: d.customers && typeof d.customers === 'object' ? d.customers : {},
    charges: Array.isArray(d.charges) ? d.charges : [], pays: Array.isArray(d.pays) ? d.pays : [], subs: Array.isArray(d.subs) ? d.subs : [],
    cfg: Object.assign(b.cfg, d.cfg || {}), meta: Object.assign(b.meta, d.meta || {}) };
  return o;
}
function nid() { return ++db.seq.id; }

// ---- storage: IndexedDB first, localStorage as a mirror, newest copy wins ----
function idbOpen(cb) {
  try {
    var rq = indexedDB.open('ledger-db', 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
    rq.onsuccess = function () { cb(rq.result); };
    rq.onerror = rq.onblocked = function () { cb(null); };
  } catch (e) { cb(null); }
}
function idbSet(val) {
  idbOpen(function (d) {
    if (!d) return;
    try { var tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, KEY); tx.oncomplete = tx.onerror = tx.onabort = function () { d.close(); }; } catch (e) { d.close(); }
  });
}
function idbGet() {
  return new Promise(function (res) {
    var done = false, fin = function (v) { if (!done) { done = true; res(v); } };
    setTimeout(function () { fin(null); }, 2500);
    idbOpen(function (d) {
      if (!d) { fin(null); return; }
      try { var rq = d.transaction('kv').objectStore('kv').get(KEY); rq.onsuccess = function () { d.close(); fin(rq.result || null); }; rq.onerror = function () { d.close(); fin(null); }; }
      catch (e) { d.close(); fin(null); }
    });
  });
}
var pT = null;
function persist() { clearTimeout(pT); pT = setTimeout(flush, 350); }
function flush() {
  if (!db) return;
  clearTimeout(pT); pT = null;
  db.meta.saved = Date.now();
  idbSet(db);
  try { var s = JSON.stringify(db); if (s.length < 3500000) localStorage.setItem(KEY, s); else localStorage.removeItem(KEY); } catch (e) {}
}
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); });
function load() {
  var ls = null;
  try { ls = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { ls = null; }
  return idbGet().then(function (d) {
    var pick = (ls && d) ? ((d.meta && d.meta.saved || 0) >= (ls.meta && ls.meta.saved || 0) ? d : ls) : (ls || d);
    db = fixDb(pick);
  });
}

// ---- indexes and account math ----
function dirty() { idx = null; ver++; accCache = {}; persist(); }
function ensure() {
  if (idx) return idx;
  idx = { ch: {}, py: {} };
  db.charges.forEach(function (c) { if (!c.void) (idx.ch[c.cid] = idx.ch[c.cid] || []).push(c); });
  db.pays.forEach(function (p) { if (!p.void) (idx.py[p.cid] = idx.py[p.cid] || []).push(p); });
  return idx;
}
// payments settle the oldest charges first; everything else is derived from that
function acct(cid) {
  var c = accCache[cid];
  if (c) return c;
  var ix = ensure(), ch = (ix.ch[cid] || []).slice(), py = ix.py[cid] || [], td = today();
  ch.sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : a.id - b.id; });
  var paid = 0, total = 0, last = 0;
  py.forEach(function (p) { paid += p.amt; if (p.ts > last) last = p.ts; });
  paid = r2(paid);
  var rem = paid, items = [], overdue = 0, maxLate = 0, next = null, nextLeft = 0;
  ch.forEach(function (x) {
    total += x.amt;
    var got = Math.min(x.amt, Math.max(0, rem)); got = r2(got); rem = r2(rem - got);
    var left = r2(x.amt - got), late = left > 0.004 && x.due < td;
    if (late) { overdue += left; maxLate = Math.max(maxLate, dayDiff(td, x.due)); }
    if (left > 0.004 && !next) { next = x; nextLeft = left; }
    items.push({ c: x, paid: got, left: left, late: late, status: left <= 0.004 ? 'paid' : (got > 0 ? 'part' : (late ? 'late' : 'open')) });
  });
  total = r2(total);
  c = { items: items, total: total, paid: paid, bal: r2(total - paid), overdue: r2(overdue), maxLate: maxLate, next: next, nextLeft: nextLeft, lastPay: last,
    oldestLate: items.filter(function (i) { return i.late; }).map(function (i) { return i.c.due; })[0] || null };
  accCache[cid] = c;
  return c;
}
function activeCustomers() { return Object.keys(db.customers).map(function (k) { return db.customers[k]; }).filter(function (c) { return !c.arch; }); }
function totals() {
  var t = { out: 0, overdue: 0, lateN: 0, owingN: 0, today: 0, month: 0, todayN: 0 }, td = today(), mo = ymOf(td);
  activeCustomers().forEach(function (c) {
    var a = acct(c.id);
    if (a.bal > 0.004) { t.out += a.bal; t.owingN++; }
    if (a.overdue > 0.004) { t.overdue += a.overdue; t.lateN++; }
  });
  db.pays.forEach(function (p) { if (p.void) return; if (p.d === td) { t.today += p.amt; t.todayN++; } if (ymOf(p.d) === mo) t.month += p.amt; });
  t.out = r2(t.out); t.overdue = r2(t.overdue); t.today = r2(t.today); t.month = r2(t.month);
  return t;
}

// ---- mutations ----
function addCustomer(name, phone, note) {
  var c = { id: nid(), name: String(name).trim(), phone: String(phone || '').trim(), note: String(note || '').trim(), created: Date.now() };
  db.customers[c.id] = c; dirty(); return c;
}
function addCharge(cid, amt, due, desc, extra) {
  var c = Object.assign({ id: nid(), cid: cid, amt: r2(amt), date: today(), due: due || today(), desc: desc || '', kind: 'debt' }, extra || {});
  db.charges.push(c); dirty(); return c;
}
function addInstallments(cid, total, n, firstDue, desc) {
  var each = Math.floor(total / n * 100) / 100, plan = nid(), day = +firstDue.slice(8), base = desc || 'قسط';
  for (var i = 0; i < n; i++) {
    var amt = i === n - 1 ? r2(total - r2(each * (n - 1))) : each;
    db.charges.push({ id: nid(), cid: cid, amt: amt, date: today(), due: addMonthIso(firstDue, i, day), desc: base + ' ' + (i + 1) + '/' + n, kind: 'inst', plan: plan });
  }
  dirty();
}
function addSub(cid, amt, day, startYm, desc) {
  var s = { id: nid(), cid: cid, amt: r2(amt), day: day, start: startYm, last: null, active: 1, desc: desc || '' };
  db.subs.push(s); genSubs(); dirty(); return s;
}
// monthly subscriptions create their charge when the month begins
function genSubs() {
  var cm = ymOf(today()), n = 0;
  db.subs.forEach(function (s) {
    if (!s.active || !db.customers[s.cid]) return;
    var m = s.last ? nextYm(s.last) : s.start;
    while (m <= cm) {
      db.charges.push({ id: nid(), cid: s.cid, amt: s.amt, date: m + '-01', due: addMonthIso(m + '-01', 0, s.day), desc: s.desc || 'اشتراك شهري', kind: 'sub', sub: s.id });
      s.last = m; m = nextYm(m); n++;
    }
  });
  if (n) dirty();
  return n;
}
function addPayment(cid, amt, method, note, dateIso) {
  var d = dateIso || today(), ts = d === today() ? Date.now() : parseIso(d).getTime() + 12 * 3600000;
  var p = { id: nid(), no: ++db.seq.rec, cid: cid, amt: r2(amt), ts: ts, d: d, m: method || 'cash', t: String(note || '').trim() };
  db.pays.push(p);
  idx = null; ver++; accCache = {};
  p.after = acct(cid).bal;               // balance right after this payment, kept for the receipt
  dirty(); return p;
}
function methodName(m) { return m === 'transfer' ? 'تحويل' : m === 'other' ? 'أخرى' : 'نقداً'; }

/* ================= phone / whatsapp ================= */
function intl(phone) {
  var t = toEn(phone).trim(), digits = t.replace(/\D/g, ''), cc = String(db.cfg.cc || '').replace(/\D/g, '');
  if (!digits) return '';
  if (t.charAt(0) === '+') return digits;
  if (digits.indexOf('00') === 0) return digits.slice(2);
  if (cc && digits.charAt(0) === '0') return cc + digits.slice(1);
  if (cc && digits.indexOf(cc) !== 0 && digits.length <= 10) return cc + digits;
  return digits;
}
function waLink(phone, text) { var n = intl(phone); return n ? 'https://wa.me/' + n + '?text=' + encodeURIComponent(text || '') : ''; }
function fill(tpl, vars) {
  return String(tpl).replace(/\{([^}]+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; });
}
function reminderText(c) {
  var a = acct(c.id), amt = a.overdue > 0.004 ? a.overdue : Math.max(a.bal, 0);
  var date = a.oldestLate || (a.next && a.next.due) || today();
  return fill(db.cfg.tpl || DEF_TPL, { 'الاسم': c.name, 'المبلغ': money(amt), 'العملة': db.cfg.curr || '', 'التاريخ': date, 'المحل': db.cfg.shop || '' }).replace(/\s+\./g, '.').replace(/ {2,}/g, ' ').trim();
}

/* ================= documents drawn as images (receipt, statement) ================= */
var DF = '"Noto Sans Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif';
function wrapLines(x, text, maxW) {
  var words = String(text).split(/\s+/), lines = [], cur = '';
  words.forEach(function (w) {
    var t = cur ? cur + ' ' + w : w;
    if (cur && x.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t;
  });
  if (cur) lines.push(cur);
  return lines;
}
// a tiny page builder: the paper is as wide as the printer's dots, the result is pure black and white
function Doc(width) {
  this.W = width || +db.cfg.pw || 384; this.P = Math.round(this.W * 0.05); this.CW = this.W - this.P * 2;
  this.cv = document.createElement('canvas'); this.cv.width = this.W; this.cv.height = 4200;
  this.x = this.cv.getContext('2d'); this.x.fillStyle = '#fff'; this.x.fillRect(0, 0, this.W, 4200);
  this.x.fillStyle = '#000'; this.x.strokeStyle = '#000'; this.y = this.P;
}
Doc.prototype.font = function (sz, bold) { this.x.font = (bold ? '700 ' : '500 ') + sz + 'px ' + DF; };
Doc.prototype.text = function (txt, sz, bold, align) {
  var x = this.x, self = this;
  this.font(sz, bold); x.direction = 'rtl'; x.textBaseline = 'top'; x.textAlign = align || 'right';
  var ax = align === 'center' ? this.W / 2 : this.W - this.P;
  wrapLines(x, txt, this.CW).forEach(function (ln) { x.fillText(ln, ax, self.y); self.y += Math.round(sz * 1.5); });
};
Doc.prototype.row = function (right, left, sz, bold) {
  var x = this.x; this.font(sz, bold); x.textBaseline = 'top';
  x.direction = 'ltr'; var lw = x.measureText(left).width;
  var r = String(right), maxR = this.CW - lw - 12;
  x.direction = 'rtl';
  if (x.measureText(r).width > maxR) { while (r.length > 1 && x.measureText(r + '…').width > maxR) r = r.slice(0, -1); r += '…'; }
  x.textAlign = 'right'; x.fillText(r, this.W - this.P, this.y);
  x.direction = 'ltr'; x.textAlign = 'left'; x.fillText(left, this.P, this.y);
  this.y += Math.round(sz * 1.5);
};
Doc.prototype.rule = function (dash) {
  var x = this.x; this.y += 6; x.save(); x.lineWidth = 2; if (dash) x.setLineDash([6, 5]);
  x.beginPath(); x.moveTo(this.P, this.y); x.lineTo(this.W - this.P, this.y); x.stroke(); x.restore(); this.y += 14;
};
Doc.prototype.gap = function (n) { this.y += n; };
Doc.prototype.box = function (label, value) {
  var x = this.x, by = this.y, bh = 118, sz = 46;
  x.lineWidth = 3; x.strokeRect(this.P, by, this.CW, bh);
  this.font(20, false); x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'top'; x.fillText(label, this.W / 2, by + 10);
  this.font(sz, true);
  while (sz > 20 && x.measureText(value).width > this.CW - 24) { sz -= 2; this.font(sz, true); }
  x.fillText(value, this.W / 2, by + 48); this.y = by + bh + 14;
};
Doc.prototype.header = function (title) {
  var shop = String(db.cfg.shop || '').trim(), ph = String(db.cfg.shopph || '').trim();
  if (shop) this.text(shop, 30, true, 'center');
  if (ph) this.text('هاتف: ' + ph, 20, false, 'center');
  if (shop || ph) this.rule(true);
  this.gap(2); this.text(title, 36, true, 'center'); this.rule(false);
};
Doc.prototype.footer = function () {
  var foot = String(db.cfg.foot || '').trim();
  if (foot) { this.gap(8); this.text(foot, 20, false, 'center'); }
  this.gap(36);
};
// pure black and white copy of the page, cropped to what was drawn
Doc.prototype.finish = function () {
  var W = this.W, H = Math.min(this.y, this.cv.height), out = document.createElement('canvas');
  out.width = W; out.height = H;
  var oc = out.getContext('2d'); oc.drawImage(this.cv, 0, 0);
  var id = oc.getImageData(0, 0, W, H), d = id.data;
  for (var q = 0; q < d.length; q += 4) {
    var v = (d[q] * 0.3 + d[q + 1] * 0.59 + d[q + 2] * 0.11) < 170 ? 0 : 255;
    d[q] = d[q + 1] = d[q + 2] = v; d[q + 3] = 255;
  }
  oc.putImageData(id, 0, 0);
  return out;
};
Doc.prototype.blob = function () {
  var out = this.finish();
  return new Promise(function (res, rej) { out.toBlob(function (b) { b ? res(b) : rej(new Error('blob')); }, 'image/png'); });
};
function curTxt() { return db.cfg.curr ? ' ' + db.cfg.curr : ''; }

}
function renderStatement(c) { return statementDoc(c).blob(); }
function receiptText(p) {

function statementText(c) {

/* ================= direct printing: the "cat printer" Bluetooth protocol (MX10 and relatives) =================
   Frame: 51 78 | command | 00 | length (2 bytes, little endian) | payload | CRC-8 (poly 0x07) of the payload | FF
   Rows: command A2, 48 bytes (384 dots), bit 0 = leftmost dot, 1 = black. */
var CAT_W = 384, CAT_BYTES = 48;
var CAT_ENERGY = { light: 0x3000, normal: 0x4800, dark: 0x6000 };
function crc8(bytes) {
  var c = 0;
  for (var i = 0; i < bytes.length; i++) { c ^= bytes[i]; for (var k = 0; k < 8; k++) c = (c & 0x80) ? (((c << 1) ^ 0x07) & 0xFF) : ((c << 1) & 0xFF); }
  return c;
}
function catFrame(cmd, payload) {
  var n = payload.length, f = new Uint8Array(n + 8);
  f[0] = 0x51; f[1] = 0x78; f[2] = cmd; f[3] = 0; f[4] = n & 255; f[5] = n >> 8;
  f.set(payload, 6); f[6 + n] = crc8(payload); f[7 + n] = 0xFF;
  return f;
}
function catRows(canvas) {
  var W = canvas.width, H = canvas.height;
  if (W !== CAT_W) throw new Error('width');
  var d = canvas.getContext('2d').getImageData(0, 0, W, H).data, rows = [];
  for (var y = 0; y < H; y++) {
    var r = new Uint8Array(CAT_BYTES);
    for (var x = 0; x < W; x++) if (d[(y * W + x) * 4] < 128) r[x >> 3] |= 1 << (x & 7);
    rows.push(r);
  }
  return rows;
}
// the whole job as one byte stream (the MX10 family feeds paper by sending blank rows)
function catStream(rows, density) {
  var parts = [], en = CAT_ENERGY[density] || CAT_ENERGY.normal, i, total = 0;
  var P = function (cmd, payload) { parts.push(catFrame(cmd, payload)); };
  P(0xA3, [0]); P(0xA3, [0]);                       // device state, then start printing
  P(0xA4, [0x32]);                                   // 200 dpi
  P(0xBD, [32]);                                     // speed
  P(0xAF, [en & 255, en >> 8]);                      // energy
